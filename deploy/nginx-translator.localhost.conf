# translator — the phone-first English look-up app. The same process also serves
# the LAN on :8787, which is what the pairing QR points the phone at; this vhost
# is the desktop alias (http://translator.localhost) and is loopback-only, so the
# pairing token can never leak through nginx to another machine.
server {
    listen 80;
    listen [::]:80;

    server_name translator.localhost;

    location / {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8787;

        # Look-ups stream over SSE: buffering would hold the answer back until
        # the last token instead of letting it appear word by word.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # A look-up can sit idle between tokens; do not cut the socket.
        proxy_read_timeout 3600;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
